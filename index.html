<style>
:root{--ink:#2a1233;--plum:#4a1d5c;--gold:#f4b400;--leaf:#1e6b52;--blush:#fceff3;--muted:#665670;--line:#e6d9ea}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font:18px/1.7 Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3,nav,button,.btn,label,input,select,textarea,.tag{font-family:"Inter",system-ui,sans-serif}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:.2em 0 .4em}
h2{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2;margin:1.6em 0 .5em}
h3{margin:0 0 .3em;font-size:1.2rem}
a{color:var(--plum)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:1.5rem 1.25rem}
.narrow{max-width:640px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff}
header .wrap{display:flex;align-items:center;gap:1.25rem;padding:.6rem 1.25rem}
.logo{font:800 1.5rem "Inter",sans-serif;color:var(--gold);text-decoration:none;letter-spacing:.02em}
nav{display:flex;gap:.25rem;overflow-x:auto;flex:1}
nav a{color:#fff;text-decoration:none;padding:.5rem .8rem;border-radius:999px;white-space:nowrap;font-weight:500}
nav a:hover{background:rgba(255,255,255,.12)}
nav a[aria-current=page]{background:var(--gold);color:var(--ink)}
.banner{background:var(--gold);color:var(--ink);text-align:center;padding:.4rem 1rem;font:500 .9rem "Inter",sans-serif}
.hero{background:var(--ink);color:#fff}
.hero .wrap{padding:3rem 1.25rem 3.5rem}
.hero .big{font:800 clamp(3.6rem,15vw,10.5rem)/.88 "Inter",sans-serif;margin:0;letter-spacing:-.03em}
.big span{display:block}
.big span:nth-child(1){color:var(--gold)}.big span:nth-child(3){color:#f7b6cb}
.hero p{max-width:34rem;font-size:1.2rem;margin:1.5rem 0}
.btn{display:inline-block;background:var(--gold);color:var(--ink);border:2px solid var(--gold);padding:.65rem 1.3rem;border-radius:999px;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(.95)}
.btn.alt{background:transparent;color:inherit;border-color:currentColor}
.btn.sm{padding:.3rem .8rem;font-size:.9rem}
.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{border:2px solid var(--line);border-radius:14px;padding:1.25rem;background:#fff}
.card.tint{background:var(--blush);border-color:var(--blush)}
.card a.more{font-family:"Inter",sans-serif;font-weight:700}
.tag{font-size:.85rem;color:var(--muted)}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:1rem 0}
.prose{max-width:40rem}
.bar{display:grid;grid-template-columns:9rem 1fr 3rem;gap:.75rem;align-items:center;margin:.5rem 0;font-family:"Inter",sans-serif}
.bar i{display:block;height:1.1rem;background:var(--leaf);border-radius:4px}
form{display:grid;gap:1rem}
label{display:grid;gap:.3rem;font-weight:700}
input,select,textarea{font:400 1rem/1.4 "Inter",sans-serif;padding:.65rem .8rem;border:2px solid var(--line);border-radius:10px;width:100%}
textarea{min-height:12rem}
.err{color:#b00020;margin:0}.ok{color:var(--leaf);margin:0;font-weight:700}
.rows{list-style:none;padding:0;margin:0}
.rows li{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line)}
.rows li b{flex:1 1 14rem;font-family:"Inter",sans-serif}
footer{background:var(--blush);margin-top:3rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;font-size:.95rem}
.people{list-style:none;padding:0;margin:.5rem 0 0}.people li{padding:.2rem 0}
.ph{display:grid;place-items:center;aspect-ratio:var(--r,4/3);margin:0;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--blush) 0 14px,#f6dfe8 14px 28px);color:var(--plum);font:500 .9rem "Inter",sans-serif;text-align:center;padding:1rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block;margin:-1rem}
.ph:has(img){padding:0}.ph img{margin:0}
.tall{--r:4/5}.wide{--r:16/9}.sq{--r:1/1}
.hero-ph{box-shadow:12px 12px 0 var(--gold);margin-right:12px}
.split{display:grid;gap:2rem;align-items:center}
.split .big{font-size:clamp(3.4rem,11vw,7.5rem)}
.grid3{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.av{width:96px;height:96px;border-radius:50%;margin-bottom:.8rem;overflow:hidden;background:repeating-linear-gradient(135deg,var(--blush) 0 8px,#f6dfe8 8px 16px)}
.av img{width:100%;height:100%;object-fit:cover}
.band{background:var(--leaf);color:#fff;border-radius:18px;padding:2rem;margin:2.5rem 0;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.band h2{margin:0;font-size:1.6rem}
@media(min-width:820px){.split{grid-template-columns:1.1fr .9fr}}
/* v3 visual refresh */
:root{--rose:#b8325f}
body{overflow-x:hidden}
h1,h2{letter-spacing:-.02em}
.sec{padding:4.5rem 0}.sec>.wrap{padding-block:0}.sec h2{margin:0 0 1.5rem}
.sec.blush{background:var(--blush)}.sec.dark{background:var(--plum);color:#fff}
.sec .btn.alt{color:var(--plum)}.dark .btn.alt{color:#fff}
.lead{font-size:1.3rem;line-height:1.6}
.hero{background:radial-gradient(120% 90% at 85% 10%,#6a2a82 0,var(--ink) 62%)}
.hero .wrap{padding:3.5rem 1.25rem 4.5rem}
.hero p{color:#eadff0}
.hero-art{position:relative;width:100%;max-width:430px;margin-inline:auto}
.hero-art::before{content:"";position:absolute;width:75%;aspect-ratio:1;border-radius:50%;background:var(--gold);right:-10%;top:-5%}
.hero-art .ph{position:relative}
.ph{background:radial-gradient(circle at 22% 18%,#f4b40066 0 20%,#0000 21%),radial-gradient(circle at 85% 88%,#ffffff26 0 26%,#0000 27%),linear-gradient(145deg,var(--plum),var(--rose));color:#fff;border-radius:22px;place-items:end start}
.ph span{background:#00000059;padding:.25rem .75rem;border-radius:999px;font-size:.8rem}
.ph:has(img){padding:0}
.arch{border-radius:999px 999px 22px 22px}
.card{border:0;box-shadow:0 8px 24px #2a12331a;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.pillars{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pillar{border-radius:22px;padding:2rem;min-height:15rem;display:flex;flex-direction:column;justify-content:flex-end}
.pillar h3{font-size:2.6rem;line-height:1;margin:0 0 .7rem;letter-spacing:-.02em}.pillar p{margin:0}
.pillar.a{background:var(--gold);color:var(--ink)}.pillar.b{background:var(--leaf);color:#fff}.pillar.c{background:var(--plum);color:#fff}
.mosaic{display:grid;gap:1rem;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(180px,1fr))}
.mosaic .ph{aspect-ratio:auto;height:100%}
.mosaic .ph:first-child{grid-column:span 2;grid-row:span 2}.mosaic .ph:nth-child(n+2){grid-column:span 2}
.cta{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center;justify-content:space-between}.cta h2{margin:0;max-width:30rem}
footer{background:var(--ink);color:#eadff0}footer a{color:var(--gold)}
header .btn.sm{white-space:nowrap}
@media(max-width:700px){.sec{padding:3rem 0}.mosaic{grid-template-columns:1fr 1fr}.mosaic .ph:first-child{grid-column:span 2;grid-row:auto;min-height:220px}.mosaic .ph:nth-child(n+2){grid-column:auto}}
@media(max-width:560px){.bar{grid-template-columns:6rem 1fr 2.6rem}}
@media(prefers-reduced-motion:no-preference){.hero .big span{animation:rise .7s both}.hero .big span:nth-child(2){animation-delay:.12s}.hero .big span:nth-child(3){animation-delay:.24s}}
@keyframes rise{from{opacity:0;transform:translateY(.25em)}}
/* v4 corporate burgundy */
:root{--ink:#221a1e;--plum:#6e1631;--leaf:#6e1631;--gold:#c9a66b;--blush:#f5f1f2;--line:#e5dde0;--muted:#6b5f64}
body{font:17px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.01em}
header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.logo{color:var(--plum);font-weight:700;letter-spacing:.04em}
header nav a{color:var(--ink);border-radius:0;padding:.5rem .75rem}
header nav a:hover{background:var(--blush)}
header nav a[aria-current=page]{background:none;color:var(--plum);box-shadow:inset 0 -3px var(--plum)}
.btn{background:var(--plum);color:#fff;border-color:var(--plum);border-radius:6px;font-weight:600}
.btn:hover{filter:none;background:#571127}
.btn.alt{background:transparent;color:var(--plum)}
.hero .btn,.dark .btn{background:#fff;color:var(--plum);border-color:#fff}
.hero .btn.alt,.dark .btn.alt{background:transparent;color:#fff;border-color:#fff}
.hero{background:linear-gradient(135deg,#3f0d1f,var(--plum))}
.hero .wrap{padding:4rem 1.25rem 4.5rem}
.hero .big,.split .big{font:600 clamp(2.4rem,6vw,4.1rem)/1.1 "Source Serif 4",Georgia,serif;letter-spacing:-.01em}
.big span{display:inline;margin-right:.25em;animation:none;color:#fff!important}.big span:last-child{margin:0}
.hero p{font-size:1.15rem;color:#f0e4e8}
.hero-art{max-width:none}.hero-art::before{display:none}.hero .ph{--r:4/3}
.ph,.arch{border-radius:8px}
.ph{background:linear-gradient(145deg,#4a0f23,#7a2442);place-items:end start}
.av{background:linear-gradient(145deg,#4a0f23,#7a2442)}
.card{border:1px solid var(--line);border-radius:8px;box-shadow:none}.card:hover{transform:none}
.card.tint{background:var(--blush);border-color:var(--blush)}
.pillar.a,.pillar.b,.pillar.c{background:#fff;color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--plum);border-radius:8px;min-height:0;padding:1.75rem}
.pillar h3{font-size:1.6rem;margin-bottom:.5rem}
.band{border-radius:8px}
footer{background:var(--ink)}footer nav{flex:0 1 auto;flex-wrap:wrap;gap:1rem}footer a,footer nav a{color:#e8dde1;padding:0}
/* v5 motion */
.hero{position:relative;overflow:hidden}.hero .wrap{position:relative;z-index:1}
.hero::before{content:"";position:absolute;width:60vw;aspect-ratio:1;border-radius:50%;background:radial-gradient(#b4466b66,#0000 65%);top:-25%;right:-12%;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-9vw,7vh) scale(1.25)}}
.hero .big span{display:inline-block;animation:wordUp .9s cubic-bezier(.2,.7,.2,1) both}
.hero .big span:nth-child(n){animation-delay:calc(.15s + var(--i,0)*.2s)}
.hero .big span:nth-child(2){--i:1}.hero .big span:nth-child(3){--i:2}
@keyframes wordUp{from{opacity:0;transform:translateY(.6em);filter:blur(6px)}}
.hero p,.hero .btn{animation:wordUp .9s .8s cubic-bezier(.2,.7,.2,1) both}
.hero .ph{animation:wipe 1.3s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.hero .ph img{animation:zoom 16s ease-out both}
@keyframes zoom{from{transform:scale(1.14)}}
.ticker{background:#fff;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:.9rem 0}
.ticker div{display:inline-block;animation:tick 32s linear infinite}
.ticker span{font:600 1.4rem "Source Serif 4",Georgia,serif;color:var(--plum);margin:0 1.2rem}
.ticker span::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--plum);margin-left:2.4rem;vertical-align:middle}
@keyframes tick{to{transform:translateX(-50%)}}
.js .rv{opacity:0;translate:0 28px;transition:opacity .7s ease var(--d,0s),translate .7s ease var(--d,0s)}
.js .rv.in{opacity:1;translate:0 0;transition:opacity .7s ease var(--d,0s),translate .7s ease var(--d,0s),transform .25s,border-color .25s,box-shadow .25s}
.card{transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:var(--plum);box-shadow:0 14px 30px #6e163124}
.btn{transition:transform .2s,background .2s}.btn:hover{transform:translateY(-2px)}
.ph img{transition:transform .7s}.mosaic .ph:hover img,.split .sec .ph:hover img,.sec .ph:hover img{transform:scale(1.06)}
.pillar.a,.pillar.b,.pillar.c{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.pillar::before{content:"";position:absolute;left:0;top:0;height:4px;width:0;background:var(--plum);transition:width 1s .25s}
.pillar.in::before{width:100%}
header{transition:box-shadow .3s}header.sc{box-shadow:0 4px 18px #2a12331f}
#app>*{animation:pgIn .5s ease both}@keyframes pgIn{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;translate:none}}
/* v6 footer */
footer{background:#2a0d17;color:#d9c9ce;margin-top:0}
footer .fgrid{display:grid;gap:2.5rem;grid-template-columns:1.4fr 1fr 1fr 1.2fr;padding:3.5rem 1.25rem 2.5rem}
footer h4{font:600 .95rem Inter,sans-serif;color:#fff;margin:0 0 .9rem}
footer p{margin:.35rem 0}
footer a{display:block;color:#d9c9ce;text-decoration:none;padding:.25rem 0}footer a:hover{color:#fff}
footer .logo{display:inline-block;color:#fff;font-size:1.8rem;padding:0}
.fnote{max-width:18rem}
.social{display:flex;gap:.6rem;margin-top:1.25rem}
footer .social a{display:grid;place-items:center;width:40px;height:40px;border:1px solid #ffffff40;border-radius:50%;padding:0;transition:background .2s,color .2s,transform .2s}
footer .social a:hover{background:#fff;color:var(--plum);transform:translateY(-3px)}
.social svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fbar{border-top:1px solid #ffffff22}
footer .fbar .wrap{padding:1.25rem;font-size:.9rem;justify-content:space-between}
@media(max-width:820px){footer .fgrid{grid-template-columns:1fr 1fr}.fbrand{grid-column:1/-1}}
header{padding-top:env(safe-area-inset-top,0px)}footer{padding-bottom:env(safe-area-inset-bottom,0px)}
/* v7 logo, full-screen sections, sticky footer */
:root{--hh:62px}
html{scroll-padding-top:var(--hh);scroll-snap-type:y proximity}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
main{flex:1 0 auto;display:block}
footer{flex-shrink:0;scroll-snap-align:end}
.logo{display:inline-flex;align-items:center;line-height:0}
.logo img{display:block;height:46px;width:46px;border-radius:6px;object-fit:cover}
footer .logo img{height:64px;width:64px}
main>section,main>article{scroll-snap-align:start}
.hero{min-height:calc(100vh - var(--hh));min-height:calc(100svh - var(--hh));display:flex;flex-direction:column}
.hero>.wrap{flex:1;display:grid;align-content:center;width:100%}
.hero>.ticker{flex:none;position:relative;z-index:1}
.sec{min-height:calc(100vh - var(--hh));min-height:calc(100svh - var(--hh));display:flex;flex-direction:column;justify-content:center}
.sec>.wrap{width:100%}
.sec>.wrap.cta{margin-inline:auto}
main>.wrap,main>article.wrap{min-height:calc(100vh - var(--hh));min-height:calc(100svh - var(--hh))}
.page{min-height:calc(100vh - var(--hh));min-height:calc(100svh - var(--hh))}
@media(max-width:700px){.sec,.page{padding-block:2.5rem}}
</style>

let ready=Promise.resolve(),authDone;const authReady=new Promise(r=>authDone=r);
let fb={},user=null,isAdmin=false,editId=null;
const mem={articles:[...SAMPLE.articles]};

async function init(){
 if(!LIVE){$("#demo").hidden=false;authDone();return}
 const b="https://www.gstatic.com/firebasejs/10.12.2/";
 const [app,fs,au]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-firestore.js"),import(b+"firebase-auth.js")]);
 const a=app.initializeApp(FIREBASE_CONFIG);
 fb={fs,au,db:fs.getFirestore(a),auth:au.getAuth(a)};
 au.onAuthStateChanged(fb.auth,async u=>{
  user=u;isAdmin=false;
  if(u){try{isAdmin=(await fs.getDoc(fs.doc(fb.db,"admins",u.uid))).exists()}catch{}}
  authDone();if(location.hash.startsWith("#/admin"))render();
 });
}

const api={
 async articles(all){
  if(!LIVE)return mem.articles.filter(a=>all||a.status=="published").sort((x,y)=>y.date-x.date);
  const{fs,db}=fb,c=fs.collection(db,"articles");
  const q=all?fs.query(c,fs.orderBy("date","desc")):fs.query(c,fs.where("status","==","published"));
  return(await fs.getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.date-x.date);
 },
 async article(id){
  if(!LIVE)return mem.articles.find(a=>a.id==id&&a.status=="published");
  try{const d=await fb.fs.getDoc(fb.fs.doc(fb.db,"articles",id));return d.exists()?{id,...d.data()}:null}catch{return null}
 },
 async save({id,...a}){
  a.date=a.date||Date.now();
  if(!LIVE){id?Object.assign(mem.articles.find(x=>x.id==id),a):mem.articles.push({id:"a"+Date.now(),...a});return}
  const{fs,db}=fb;
  id?await fs.setDoc(fs.doc(db,"articles",id),a):await fs.addDoc(fs.collection(db,"articles"),a);
 },
 async remove(id){
  if(!LIVE){mem.articles=mem.articles.filter(a=>a.id!=id);return}
  await fb.fs.deleteDoc(fb.fs.doc(fb.db,"articles",id));
 },
 async submit(d){
  if(!LIVE)return;
  await fb.fs.addDoc(fb.fs.collection(fb.db,"submissions"),{...d,date:Date.now()});
 }
};

  return `<section class="page wrap"><h1>Our departments</h1><p class="prose">Each department has its own focus and team.</p>
  <div class="grid">${d.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.blurb)}</p><ul class="people">${(x.members||[]).map(m=>`<li><b>${esc(m.name)}</b>, ${esc(m.role)}</li>`).join("")}</ul></div>`).join("")}</div></section>`;
 },
 async funding(){
  const f=await api.funds();
  return `<section class="page wrap prose"><h1>How we raise funds</h1>
  <p>We publish where our money comes from so that supporters can see how their gift fits in.</p>
  <h2>Where funds come from</h2>
  ${f.sources.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.min(100,+v||0)}%"></i><span>${+v||0}%</span></div>`).join("")}
  <p class="tag">${esc(f.note||"")}</p>
  <h2>How funds are used</h2><p>Sample text: explain how funds are shared across programs.</p></section>`;
 },
 async support(){
  return `<section class="page wrap"><h1>Support us</h1><div class="grid">
  <div class="card tint"><h3>Give by M-Pesa</h3><p>Paybill: [add number]<br>Account: [add account name]</p><p class="tag">Card payments need a payment provider to be connected.</p></div>
  <div class="card tint"><h3>Volunteer or partner</h3><p>Give your time, or work with us as a company, school or organization. Use the form below.</p></div>
  <div class="card tint"><h3>Spread the word</h3><p>Share our articles and tell someone about ELO.</p></div></div>
  <h2>Get in touch</h2><form class="narrow" data-f="contact"><label>I want to<select name="type"><option>Volunteer</option><option>Partner or sponsor</option><option>Ask a question</option></select></label>
  <label>Your name<input name="name" required maxlength="100" autocomplete="name"></label>
  <label>Email<input name="email" type="email" required maxlength="150" autocomplete="email"></label>
  <label>Message<textarea name="message" required maxlength="1500" style="min-height:7rem"></textarea></label>
  <button class="btn">Send message</button><p id="msg" role="status"></p></form></section>`;
 },
 async articles(){
  const l=await api.articles();
  return `<section class="page wrap"><h1>Articles</h1>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:"<p>No articles yet. Check back soon.</p>"}</section>`;
 },
 async article(id){
  const a=await api.article(id);
  if(!a)return `<section class="page wrap"><h1>Article not found</h1><p><a href="#/articles">Back to all articles</a></p></section>`;
  document.title=a.title+" – ELO";
  return `<article class="page wrap prose"><p><a href="#/articles">All articles</a></p><h1>${esc(a.title)}</h1><p class="tag">${fmt(a.date)} by ${esc(a.author||"ELO")}</p>${img(a.cover)}${md(a.body)}</article>`;
 },
 async admin(){
  await authReady;
  if(!user)return `<section class="page wrap narrow"><h1>Editor sign in</h1>
  <form data-f="login"><label>Email<input name="email" type="email" required autocomplete="username"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn">Sign in</button><p class="err" id="msg" role="alert"></p></form>
  ${LIVE?"":`<p>Demo mode: <button class="btn sm alt" data-act="demo">Open the demo editor</button></p>`}</section>`;
  if(!isAdmin)return `<section class="page wrap narrow"><h1>Not an editor yet</h1><p>You are signed in as ${esc(user.email)}, but this account cannot publish. Send your user ID to an ELO admin: <b>${esc(user.uid)}</b></p><button class="btn alt" data-act="out">Sign out</button></section>`;
  const l=await api.articles(true),e=editId&&l.find(x=>x.id==editId)||{};
  return `<section class="page wrap"><h1>${e.id?"Edit article":"New article"}</h1>
  <form class="narrow" data-f="article"><input type="hidden" name="id" value="${esc(e.id)}"><input type="hidden" name="date" value="${e.date||""}">
  <label>Title<input name="title" required maxlength="150" value="${esc(e.title)}"></label>
  <label>Summary<input name="summary" required maxlength="300" value="${esc(e.summary)}"></label>
  <label>Author<input name="author" required maxlength="100" value="${esc(e.author)}"></label>
  <label>Cover image link (https)<input name="cover" type="url" value="${esc(e.cover)}"></label>
  <label>Article text<textarea name="body" required>${esc(e.body)}</textarea></label>
  <p class="tag">Leave a blank line between paragraphs. Start a line with ## for a heading.</p>
  <label>Status<select name="status"><option value="draft"${e.status=="draft"?" selected":""}>Draft</option><option value="published"${e.status=="published"?" selected":""}>Published</option></select></label>
  <div><button class="btn">Save article</button> ${e.id?`<button type="button" class="btn alt" data-act="new">Cancel</button>`:""}</div><p id="msg" role="status"></p></form>
  <h2>All articles</h2><ul class="rows">${l.map(a=>`<li><b>${esc(a.title)}</b><span class="tag">${a.status=="published"?"Published":"Draft"}</span>
  <button class="btn sm alt" data-act="edit" data-id="${esc(a.id)}">Edit</button><button class="btn sm alt" data-act="del" data-id="${esc(a.id)}">Delete</button></li>`).join("")||"<li>No articles yet.</li>"}</ul>
  <p><button class="btn alt" data-act="out">Sign out</button></p></section>`;
 }
};

function reveal(){
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
 document.querySelectorAll("#app .sec h2,#app .lead,#app .card,#app .pillar,#app .ph,#app .band,#app .cta>*,#app .prose>*,#app .bar").forEach(el=>{
  if(el.closest(".hero"))return;
  el.style.setProperty("--d",[...el.parentElement.children].indexOf(el)%4*.12+"s");
  el.classList.add("rv");io.observe(el);
 });
}
const setHH=()=>document.documentElement.style.setProperty("--hh",$("header").offsetHeight+"px");
setHH();addEventListener("resize",setHH);addEventListener("load",setHH);
addEventListener("scroll",()=>$("header").classList.toggle("sc",scrollY>10),{passive:true});
async function render(){
 const[r,id]=location.hash.slice(2).split("/");
 document.title="ELO – Empower. Lead. Own.";
 document.querySelectorAll("nav a").forEach(a=>a.hash=="#/"+r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 $("#app").innerHTML='<p class="page wrap">Loading…</p>';
 try{$("#app").innerHTML=await(views[r||"home"]||views.home)(id);reveal()}
 catch(e){$("#app").innerHTML=`<section class="page wrap"><h1>This page did not load</h1><p>Check your connection and refresh the page.</p></section>`}
}
addEventListener("hashchange",()=>{editId=null;render();scrollTo(0,0)});

const say=(t,c)=>{const m=$("#msg");if(m){m.className=c||"";m.textContent=t}};
document.addEventListener("submit",async e=>{
 const f=e.target.dataset.f;if(!f)return;e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 try{
  if(f=="login"){
   try{await fb.au.signInWithEmailAndPassword(fb.auth,d.email,d.password)}catch{return say("Sign-in failed. Check your email and password and try again.","err")}
  }
  if(f=="contact"){await api.submit(d);e.target.reset();say("Thank you. We will reply by email.","ok")}
  if(f=="article"){
   d.date=+d.date||0;if(!d.id)delete d.id;
   await api.save(d);editId=null;await render();say("Saved","ok");
  }
 }catch{say("That did not work. Check your connection and try again.","err")}
});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act;
 if(a=="demo"){user={email:"demo",uid:"demo"};isAdmin=true}
 if(a=="out"){LIVE?await fb.au.signOut(fb.auth):(user=null,isAdmin=false)}
 if(a=="edit")editId=b.dataset.id;
 if(a=="new")editId=null;
 if(a=="del"&&confirm("Delete this article? This cannot be undone."))await api.remove(b.dataset.id);
 render();if(a=="edit")scrollTo(0,0);
});
ready=init().catch(()=>{authDone();$("#demo").textContent="Firebase did not load. Check your settings in index.html.";$("#demo").hidden=false});
render();
</script>
</body>
</html>
